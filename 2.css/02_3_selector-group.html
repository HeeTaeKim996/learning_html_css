<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selector Group</title>
    <style>
      /* A, B {..} : , 로 여러 그룹을 다중 선택 */
      .span_first,
      .span_second {
        color: red;
      }
    </style>
  </head>
  <body>
    <h1>제목</h1>
    <hr />
    <h2>1장</h2>
    <p><span class="span_first">첫째줄</span>입니다</p>
    <p><span class="span_second">둘째줄</span>입니다</p>
  </body>
</html>
