<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 기본 세팅 */
      * {
        margin: 0;
        padding: 0;
      }
      .container {
        background-color: green;
        width: 200px;
        height: 200px;
        margin-bottom: 30px;
      }
      .flex-item {
        color: white;
        width: 80px;
        height: 40px;
        background-color: purple;
        text-align: center;
        border: 1px solid yellow;
      }
      /* align-content : 컨테이너의 수직 정렬에 관한.
         ※ 이후 나오는 align-items 는 줄간격이 띄어진 반면, alignt-content는 여러줄이라도 뭉쳐서 나옴
            alignt-content 는 flex line 자체를 정렬하나,
            align-items 는 flex line 에 따라 정렬됨 */
      .flex {
        display: flex;
        flex-flow: row wrap;
      }
      .start {
        align-content: flex-start; /* 위에서 시작 */
      }
      .end {
        align-content: flex-end; /* 아래서 시작 */
      }
      .center {
        align-content: center; /* 가운데서 시작 */
      }
    </style>
  </head>
  <body>
    <div class="container flex start">
      <div class="flex-item">1</div>
      <div class="flex-item">2</div>
      <div class="flex-item">3</div>
    </div>
    <div class="container flex end">
      <div class="flex-item">1</div>
      <div class="flex-item">2</div>
      <div class="flex-item">3</div>
    </div>
    <div class="container flex center">
      <div class="flex-item">1</div>
      <div class="flex-item">2</div>
      <div class="flex-item">3</div>
    </div>
    <div class="container flex stretch">
      <div class="flex-item">1</div>
      <div class="flex-item">2</div>
      <div class="flex-item">3</div>
    </div>
  </body>
</html>
