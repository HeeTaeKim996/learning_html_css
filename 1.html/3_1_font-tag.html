<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Tag</title>
  </head>
  <body>
    <!-- h[n] : 제목. n이 작을 수록 글자 크기거 커짐 -->
    <h1>제목1</h1>
    <h2>제목2</h2>
    <h3>제목3</h3>
    <h4>제목4</h4>
    <h5>제목5</h5>
    <h6>제목6</h6>

    <!-- <hr/> : 가로로 선 긋기 -->
    <hr />

    <!-- p : 문단을 의미 -->
    <!-- <br/> : 다음줄로 넘어가기 -->
    <p>
      김치를 주 재료로 사용한 볶음밥이다.<br />
      배추김치를 사용한 볶음밥이 일반적이며 하위범주로 깍두기를 사용한 깍두기
      볶음밥이 있다.
    </p>

    <!-- i : 이테릭체, em : 강조. 둘다 이테릭체지만, em 은 음성 번역기 시 자동 강조처리가 된다.-->
    <i>이테릭체</i>입니다(글자만 관련) <br />
    <em>강조</em>입니다(음성번역관련)<br />

    <!-- b : 볼드체. strong : 볼드체. 둘 다 볼드지만, strong은 음성 번역기시 자동 강조처리가 된다.-->
    <b>볼드체</b>입니다(글자만 관련)<br />
    <strong>스트롱</strong>입니다(음성변역관련)<br />
  </body>
</html>
