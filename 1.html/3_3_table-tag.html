<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Tag</title>

    <!-- 스타일(CSS)은 추후 learn-css 파트에서 설명하니, body 내용 주심으로 보자-->
    <style>
      table {
        border: 1px solid black;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid black;
        padding: 12px;
      }

      .col1 {
        width: 80px;
      }
      .col2 {
        background-color: yellow;
      }
    </style>
  </head>
  <body>
    <h1>기본 테이블</h1>
    <table>
      <caption>
        프로필 테이블
      </caption>
      <!-- tr : row -->
      <tr>
        <!-- th : 헤더 열 (데이터 정의 열)-->
        <th>이름</th>
        <th>취미</th>
        <th>특기</th>
      </tr>

      <tr>
        <!-- td : 일반 열(튜플 열)-->
        <td>홍길동</td>
        <td>도술</td>
        <td>축지법</td>
      </tr>

      <tr>
        <td>짐코딩</td>
        <td>헬스</td>
        <td>코딩</td>
      </tr>
    </table>

    <hr />
    <table>
      <caption>
        학급 점수
      </caption>
      <!-- colgroup : col 의 속성 지정-->
      <colgroup>
        <col class="col1" />
        <col class="col2" />
        <col class="col3" />
        <col class="col4" />
        <col class="col5" />
        <col class="col6" />
      </colgroup>

      <!-- thead : 표의 제목 열을 의미-->
      <thead>
        <tr>
          <th>반</th>
          <th>이름</th>
          <th>국어</th>
          <th>영어</th>
          <th>수학</th>
          <th>코딩</th>
        </tr>
      </thead>

      <!-- tbody : 표의 내용 열을 의미-->
      <tbody>
        <tr>
          <!-- rowspan : row 로 병합 -->
          <td rowspan="2">1반</td>
          <td>홍길동</td>
          <td>90</td>
          <td>100</td>
          <td>91</td>
          <td>81</td>
        </tr>

        <tr>
          <td>짐코딩</td>
          <td>85</td>
          <td>81</td>
          <td>95</td>
          <td>100</td>
        </tr>
      </tbody>

      <!-- tfoot : 표의 마지막 열을 의미-->
      <tfoot>
        <!-- colspan : col 병합-->
        <td colspan="2">평균</td>
        <td>87.5</td>
        <td>90.5</td>
        <td>92.5</td>
        <td>90.5</td>
      </tfoot>
    </table>
  </body>
</html>
