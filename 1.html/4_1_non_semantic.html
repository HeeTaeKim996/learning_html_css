<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Non Semantic</title>
  </head>
  <body>
    <!-- non-semantic : 태그 자체에 의미가 없으며, class명으로 구분됨 
                        대표적인 예가 div, span-->
    <!-- ※ div, span의 기능적 차이는 5_inline-block 에도 간단히 다루며,
                                    2.learn-css 의 6_1_★display 에서 자세히 다룬다.
            -->
    <div class="header">Header 영역</div>
    <div class="nav">
      <ul>
        <li>Menu1</li>
        <li>Menu2</li>
        <li>Menu3</li>
        <li>Menu4</li>
      </ul>
    </div>
    <div class="main">컨텐츠 영역</div>
    <div class="footer">Footer 영역</div>
  </body>
</html>
