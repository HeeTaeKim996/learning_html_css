<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 자식 노드 : > -->
    <!-- div>ul>li -->
    <div>
      <ul>
        <li></li>
      </ul>
    </div>

    <!-- 형제 노드 : + -->
    <!-- div>ul+ol+div -->
    <div>
      <ul></ul>
      <ol></ol>
      <div></div>
    </div>

    <!-- 반복하기 : * -->
    <!-- div>ul>li*3 -->
    <div>
      <ul>
        <li></li>
        <li></li>
        <li></li>
      </ul>
    </div>

    <!-- 아이디 # -->
    <!-- span#item -->
    <span id="item"></span>

    <!-- 클래스 . -->
    <!-- span.title -->
    <span class="title"></span>

    <!-- 컨텐츠 {} -->
    <!-- p.container{Hello World~!} -->
    <p class="container">Hello World~!</p>

    <!-- 자동 넘버링 $ -->
    <!-- p.container{item$}*3 -->
    <p class="container">item1</p>
    <p class="container">item2</p>
    <p class="container">item3</p>
  </body>
</html>
