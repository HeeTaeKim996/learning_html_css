<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ListTag</title>
  </head>
  <body>
    <!-- ol : ordered list -->
    <h1>ol(Ordered List) 예시</h1>
    <ol>
      <li>1번째 요소</li>
      <li>2번째 요소</li>
      <li>3번째 요소</li>
    </ol>
    <hr />

    <!-- ul : unorderd list (가장 자주 사용됨) -->
    <h1>ul(Unordered List) 예시</h1>
    <ul>
      <li>1번째 요소</li>
      <li>2번째 요소</li>
      <li>3번째 요소</li>
    </ul>
    <hr />

    <!-- dl : definition list -->
    <h1>dl(Definition List) 예시</h1>
    <dl>
      <dt>제목1</dt>
      <dd>내용1입니다.</dd>
      <dt>제목2</dt>
      <dd>내용2입니다.</dd>
    </dl>
  </body>
</html>
