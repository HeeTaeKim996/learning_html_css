<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 100px;
        height: 100px;
        background-color: chartreuse;
        border: 1px solid darkslategray;
      }
    </style>
  </head>
  <body>
    <h2>이미지 태그</h2>
    <!-- 상대 경로로 지정-->
    <img width="200" src="../assets/images/stars.jpg" alt="별이미지" />
    <img height="120" src="../assets/images/stars.jpg" alt="별이미지" />

    <!-- 루트 경로(절대경로)로 지정-->
    <img width="200" src="/assets/images/stars.jpg" alt="별이미지" />

    <h2>오디오 태그</h2>
    <audio src="/assets/sampleMp3.mp3.mp3" controls></audio>

    <h2>비디오 태그</h2>
    <video
      width="400"
      src="/assets/sampleMp4.mp4.mp4"
      controls
      type="video/mp4"
      poster="/assets/images/stars.jpg"
    ></video>

    <h2>하이퍼 링크</h2>
    <a href="http://www.naver.com">네이버</a> 와
    <a href="http://www.google.com" target="_blank">구글</a>은 포털 사이트이다.
    <!-- target="_blank" : 새탭을 만들어 하이퍼링크 열기 (자주 사용)-->
    <br />
    <a href="#target">하단에 정의한 id="target"(10)으로 이동</a>

    <br />
    <a href="mailto:bruce.lean17@gmail.com">이메일 보내기</a>

    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
    <div>7</div>
    <div>8</div>
    <div>9</div>
    <div id="target">10</div>
  </body>
</html>
