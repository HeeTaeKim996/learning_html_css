<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .p1 {
        font-size: 16px; /* px : 고정값 */
      }
      .p2 {
        font-size: 2rem; /* [n]rem : 최상위 요소의 글자 크기의 [n]배 */
      }
      .p3_parent {
        font-size: 32px;
      }
      .p3 {
        font-size: 2em; /* [n]em : 직계 부모 기준으로 글자 크기의 [n]배 */
      }
      .rec1 {
        width: 30vw; /* vw : 전체 화면 가로 기준의 퍼센티지 (30%) */
        height: 100px;
        background-color: yellow;
      }
      .rec2 {
        width: 60vw;
        height: 20vh; /* vh : 전체 화면 세로 기준 퍼센티지 (20%) */
        background-color: brown;
      }
    </style>
  </head>
  <body>
    <p class="p1">1줄입니다</p>
    <p class="p2">2줄입니다</p>
    <div class="p3_parent">
      <p class="p3">3줄입니다</p>
    </div>

    <div class="rec1"></div>
    <div class="rec2"></div>
  </body>
</html>
