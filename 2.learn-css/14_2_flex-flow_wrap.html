<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 사전작업 */
      * {
        margin: 0;
        padding: 0;
      }
      .container {
        background-color: green;
        width: 150px;
        height: 150px;
        margin-bottom: 30px;
      }
      .flex-item {
        color: white;
        width: 40px;
        height: 40px;
        background-color: purple;
        text-align: center;
        border: 1px solid yellow;
      }
      /* */
      .flex {
        display: flex;
      }
      .wrap {
        /* flex-wrap 의 디펄트는 no-wrap (개행하지 않고, 요소의 크기를 자동 조절) */
      }
      .no-wrap {
        flex-wrap: wrap; /* 페이지를 넘어가 보낼 경우, 개행 */
      }

      .ff-rnw {
        flex-flow: row nowrap; /* flex-flow + flex-wrap 이 합쳐진 형태 */
      }
      .ff-cw {
        flex-flow: column wrap;
      }
    </style>
  </head>
  <body>
    <div class="container flex wrap">
      <div class="flex-item">1</div>
      <div class="flex-item">2</div>
      <div class="flex-item">3</div>
      <div class="flex-item">4</div>
    </div>
    <div class="container flex no-wrap">
      <div class="flex-item">1</div>
      <div class="flex-item">2</div>
      <div class="flex-item">3</div>
      <div class="flex-item">4</div>
    </div>
    <div class="container flex ff-rnw">
      <div class="flex-item">1</div>
      <div class="flex-item">2</div>
      <div class="flex-item">3</div>
      <div class="flex-item">4</div>
    </div>
    <div class="container flex ff-cw">
      <div class="flex-item">1</div>
      <div class="flex-item">2</div>
      <div class="flex-item">3</div>
      <div class="flex-item">4</div>
    </div>
  </body>
</html>
