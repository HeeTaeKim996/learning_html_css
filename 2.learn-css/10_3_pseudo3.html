<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .p1::first-letter {
        /* first-letter : 첫글자만 선택 */
        font-size: 30px;
        color: red;
      }
      .p2::first-line {
        /* first-line : 첫줄만 선택 */
        font-size: 30px;
        color: blue;
      }
      .p::selection {
        /* selection : 사용자의 드래그로 선택된 글자들 */
        background-color: red;
        color: blue;
      }
    </style>
  </head>
  <body>
    <p class="p p1">First Letter Test</p>
    <div style="width: 300px; border: 1px solid black">
      <p class="p p2">
        First Line Test입니다.First Line Test입니다.First Line Test입니다.First
        Line Test입니다.First Line Test입니다
      </p>
    </div>
  </body>
</html>
