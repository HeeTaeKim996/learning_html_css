<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 사전작업 */
      * {
        margin: 0;
        padding: 0;
      }
      .container {
        background-color: green;
        width: 100vw;
        height: 200px;
        margin-bottom: 30px;
      }
      .flex-item {
        color: white;
        width: 30px;
        height: 30px;
        background-color: purple;
        text-align: center;
        border: 1px solid yellow;
      }
      /* 개발자 도구 로 들어가 좌측 상단을 Responsive로 바꾸고 width를 축소/확대시켜서 확인해보자 */
      .flex {
        display: flex;
      }
      /* order 로 순서를 수동 지정 (자주 사용은 안함) */
      .order > .item1 {
        order: 2;
      }
      .order > .item2 {
        order: 0;
      }
      .order > .item3 {
        order: 1;
      }

      /* align-self : 앞선 컨테이너에서의 align-items 내용을 개별 요소 하나 하나로 지정 */
      .self > .item1 {
        align-self: flex-end;
      }
      .self > .item2 {
        align-self: center;
      }
      .self > .item3 {
        align-self: flex-start;
      }
    </style>
  </head>
  <body>
    <div class="container flex order">
      <div class="flex-item item1">1</div>
      <div class="flex-item item2">2</div>
      <div class="flex-item item3">3</div>
    </div>

    <div class="container flex self">
      <div class="flex-item item1">1</div>
      <div class="flex-item item2">2</div>
      <div class="flex-item item3">3</div>
    </div>
  </body>
</html>
