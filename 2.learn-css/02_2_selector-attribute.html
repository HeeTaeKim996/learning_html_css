<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selector Attribute</title>
    <style>
      h2[class] {
        color: red;
      }
      /* a[B] : a 태그 중 B 속성 전체 선택 (아래 구글 이 B == target 으로 선택됨) */
      a[target] {
        color: green;
      }
      /* [A='b'] : 속성 A 중 b 값과 일치하는 요소만 선택 */
      a[class='naver-a'] {
        color: yellow;
      }
      /* *= :  속성 값을 포함하는 요소 
      ※ 띄어쓰기 기준으로만 일치하는지 묻는 경우, ~= 으로 검색*/
      a[href*='net'] {
        color: brown;
      }

      /* ^= 속성 값으로 시작하는 요소 */
      h2[class^='google'] {
        color: aqua;
      }

      /* 속성 값으로 끝나는 요소 */
      h2[class$='tit'] {
        color: blueviolet;
      }
    </style>
  </head>
  <body>
    <h2 class="naver-title">네이버</h2>
    <a class="naver-a" href="http://www.naver.com">네이버</a>
    <h2 class="google-title">구글</h2>
    <a href="http://www.google.com" target="_blank">구글</a>
    <h2 class="daum-tit">다음</h2>
    <a href="http://www.daum.net">다음</a>
  </body>
</html>
