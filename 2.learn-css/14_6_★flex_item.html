<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 사전작업 */
      * {
        margin: 0;
        padding: 0;
      }
      .container {
        background-color: green;
        width: 100vw;
        height: 200px;
        margin-bottom: 30px;
      }
      .flex-item {
        color: white;
        width: 30px;
        height: 30px;
        background-color: purple;
        text-align: center;
        border: 1px solid yellow;
      }
      /* 개발자 도구 로 들어가 좌측 상단을 Responsive로 바꾸고 width를 축소/확대시켜서 확인해보자 */
      .flex {
        display: flex;
      }
      /* order 로 순서를 수동 지정 (자주 사용은 안함) */
      .order > .item1 {
        order: 2;
      }
      .order > .item2 {
        order: 0;
      }
      .order > .item3 {
        order: 1;
      }
      /* width : 0dp; android_weight : n 그거랑 같음
         ※ flex-grow 의 기본값은 0 (여백을 차지하지 않음) */
      .grow > .item1 {
        flex-grow: 1;
      }
      .grow > .item2 {
        flex-grow: 2;
      }
      .grow > .item3 {
        flex-grow: 1;
      }
      /* shrink : grow 가 남은 여백을 얼마만큼의 비율로 가져올것인가인 반면, flex-shrink 는 공간이 축소될 때
                  얼마만큼의 비율로 축소될거냐 에 대한.
         ※ flex-shrink의 기본값은 1. 만약 0으로 할시, width가 축소돼도 아이템은 축소되지 않음 */
      .grow-shrink > .item1 {
        flex-grow: 1;
        flex-shrink: 1;
      }
      .grow-shrink > .item2 {
        flex-grow: 1;
        flex-shrink: 3;
      }
      .grow-shrink > .item3 {
        flex-grow: 1;
        flex-shrink: 1;
      }
      /* flex-basis : 넓이 지정. 기본값은 auto */
      .basis > .item1 {
        flex-basis: 15%;
      }
      .basis > .item2 {
        flex-basis: 70%;
      }
      .basis > .item3 {
        flex-basis: 15%;
      }
      /* flex : flex-grow, flex-shrink, flex-basis 순으로 통합됨*/
      .fflex > .item1 {
        flex: 1 1 25%;
      }
      .fflex > .item2 {
        flex: 2 2 50%;
      }
      .fflex > .item3 {
        flex: 1 1 25%;
      }
      /* align-self : 앞선 컨테이너에서의 align-items 내용을 개별 요소 하나 하나로 지정 */
      .self > .item1 {
        align-self: flex-end;
      }
      .self > .item2 {
        align-self: center;
      }
      .self > .item3 {
        align-self: flex-start;
      }
    </style>
  </head>
  <body>
    <div class="container flex order">
      <div class="flex-item item1">1</div>
      <div class="flex-item item2">2</div>
      <div class="flex-item item3">3</div>
    </div>
    <div class="container flex grow">
      <div class="flex-item item1">1</div>
      <div class="flex-item item2">2</div>
      <div class="flex-item item3">3</div>
    </div>
    <div class="container flex grow-shrink">
      <div class="flex-item item1">1</div>
      <div class="flex-item item2">2</div>
      <div class="flex-item item3">3</div>
    </div>
    <hr />
    <h2>구분자</h2>
    <hr />
    <div class="container flex basis">
      <div class="flex-item item1">1</div>
      <div class="flex-item item2">2</div>
      <div class="flex-item item3">3</div>
    </div>
    <div class="container flex fflex">
      <div class="flex-item item1">1</div>
      <div class="flex-item item2">2</div>
      <div class="flex-item item3">3</div>
    </div>
    <div class="container flex self">
      <div class="flex-item item1">1</div>
      <div class="flex-item item2">2</div>
      <div class="flex-item item3">3</div>
    </div>
  </body>
</html>
