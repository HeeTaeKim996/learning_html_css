<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div,
      h2 {
        border: 1px solid black;
        height: 50px;
        /* 블록은 width, height를 수동 할당 가능. 세로로 배치됨 */
      }

      span,
      a {
        border: 1px dashed blue;
        /* 인라인은 width, height 수동 할당 불가능. 가로로 배치됨 */
      }
      .disp_non {
        display: none;
        /* none : 사용자 눈에 보이지도 않고, 공간을 차지하지도 않음 */
      }
      .vis_non {
        height: 80px;
        visibility: hidden;
        /* hidden : 사용자 눈에 보이지 않지만, 공간은 차지함 */
      }
      .inl_blo {
        display: inline-block;
        width: 60px;
        height: 80px;
        /* inline-block : inline 처럼 기본적으로 가로로 배치되며, 컨텐츠 만큼(wrap_conent 와 유사) 공간을 차지하지만,
                          block 처럼 width, height 를 통해 수동으로 크기를 지정할 수 있음 */
      }
    </style>
  </head>
  <body>
    <!--Block 태그 : display, h 가 대표적 (match_parent와 유사)-->
    <div>This is Div</div>
    <h2>This is H2</h2>
    <!--Inline 태그 : span, a 가 대표적 -->
    <span>This is Span</span><br />
    <a href="#">This is a</a>
    <!-- display : none 테스트-->
    <p class="disp_non">이 글은 보이지도 않고, 공간을 차지하지도 않습니다</p>
    <p>
      이글은 보입니다. 바로 위가 공간을 차지하지 않으니, 바로 위가 This is Span
      입니다
    </p>
    <!-- visibility : hidden 테스트-->
    <p class="vis_non">이 글은 보이지 않지만, 공간은 여전히 차지합니다</p>
    <p>위 p 가 공간을 차지하기에, 이 글의 위에는 여백이 있습니다</p>
    <!-- inline-block 테스트 -->
    <div class="inl_blo">div1</div>
    <div class="inl_blo">div2</div>
    <span class="inl_blo">span1</span>
    <span class="inl_blo">span2</span>
    <span class="inl_blo">span3</span>
  </body>
</html>
