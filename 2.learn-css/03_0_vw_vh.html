<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .first {
        background-color: aqua;
        width: 80vw; /* vw : 전체 화면 가로 기준의 퍼센티지 (80%) */
        height: 20vh; /* vh : 전체 화면 세로 기준 퍼센티지 (20%) */
      }
      .second {
        background-color: red;
        width: 20vw;
        height: 80vh;
      }
    </style>
  </head>
  <body>
    <div class="first"></div>
    <div class="second"></div>
  </body>
</html>
