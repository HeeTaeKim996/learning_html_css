<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .p1 {
        font-size: 16px; /* px : 고정값 */
      }
      .p2 {
        font-size: 2rem; /* [n]rem : 최상위 요소의 글자 크기의 [n]배 */
      }
      .p3_parent {
        font-size: 32px;
      }
      .p3 {
        font-size: 2em; /* [n]em : 직계 부모 기준으로 글자 크기의 [n]배 */
      }
    </style>
  </head>
  <body>
    <p class="p1">1줄입니다</p>
    <p class="p2">2줄입니다</p>
    <div class="p3_parent">
      <p class="p3">3줄입니다</p>
    </div>
  </body>
</html>
