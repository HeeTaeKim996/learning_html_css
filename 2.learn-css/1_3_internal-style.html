<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Internal Style</title>

    <style>
      h1 {
        color: blue;
      }
      .content {
        border: 2px solid red;
        background-color: yellow;
        padding: 10px;
      }
    </style>
    <!-- 위처럼 header 내 <style> 내 선언하는 것이 Internal Style. (자주 사용 안함) -->
  </head>
  <body>
    <h1>제목</h1>
    <p class="content">내용입니다.</p>
  </body>
</html>
