<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semantic</title>
  </head>
  <body>
    <!-- ○ semantic : 태그 자체에 의미가 있다.
         header : 문서의 헤더 영역임을 정의할 때 사용
         nav    : 사이트 내 다른 페이지나 현재 페이지로 이동하기 위한 주요 탐색 링크 모음을 정의할 때 사용
         footer : 문서의 끝 영역임을 정의할 때 사용-->
    <header>Header 영역</header>
    <nav>
      <ul>
        <li>Menu1</li>
        <li>Menu2</li>
        <li>Menu3</li>
        <li>Menu4</li>
      </ul>
    </nav>
    <main>컨텐츠 영역</main>
    <footer>Footer 영역</footer>
  </body>
</html>
