<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SelectorBasic</title>
    <style>
      /* * : 전체 선택자 */
      * {
        /* margin: 0;
        padding: 0; */
      }

      /* Type 선택자 */
      h2 {
        color: green;
      }

      /* 클래스 선택자 */
      .spanClass {
        color: red;
      }

      /* ID 선택자 */
      #spanId {
        color: blue;
      }
    </style>
  </head>
  <body>
    <h1>제목입니다</h1>
    <hr />
    <h2>1장</h2>
    <p>
      <span class="spanClass">첫번째</span>줄입니다<br />
      <span class="spanClass">두번째</span>줄입니다<br />
      <span id="spanId">세번째</span>줄입니다<br />
    </p>
  </body>
</html>
